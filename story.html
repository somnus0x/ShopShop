<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>shopshop · ของที่เห็นแล้วนึกถึงเธอ</title><style>/* STORY_STYLE */</style></head>
<body><main id="app" data-phase="inline">
<header><b class="logo"><img class="brandmark" src="CI_MARK" alt="">shopshop</b><span id="meta">ของขวัญจากโปรไฟล์</span></header>
<section id="waiting"><h1>ของที่เห็นแล้วนึกถึงเธอ</h1><p id="message" role="status">กำลังเปิดในแชต…</p></section>
<div id="ready" hidden>
<div id="profileTop"><section id="portrait" aria-label="โมเดลสไตล์ของจูน"><canvas id="scene" aria-label="ตัวละครสไตล์สมมติ"></canvas><span id="pin">สไตล์ของจูน</span><div class="spin"><button id="prev" aria-label="หมุนซ้าย">←</button><span id="spinlabel">ลากเพื่อหมุน</span><button id="next" aria-label="หมุนขวา">→</button></div></section>
<section class="story" aria-label="โพสต์ที่มาของไอเดีย">
<div class="segments" id="segments" aria-label="เลือกโพสต์"></div>
<div class="by"><span id="handle"></span><span id="counter"></span></div>
<figure id="sourceMedia" hidden><img id="postPhoto" alt=""><figcaption id="photoCredit"></figcaption></figure>
<button id="surface" aria-label="ดูโพสต์ถัดไป"><span id="recapArt" hidden aria-hidden="true"><img id="juneArt" src="CI_JUNE" alt=""></span><span class="sticker" id="sticker" aria-hidden="true"></span><span class="story-copy"><span id="mixLabel" hidden>Vibe mix</span><span id="quote"></span><span id="mixLegend" hidden></span><span id="recapDetail" hidden></span></span></button>
<div id="mediaActions" hidden><button type="button" id="attachPhoto">เพิ่มภาพของโพสต์นี้ ＋</button><input id="photoInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/avif" hidden><a id="sourceLink" target="_blank" rel="noopener noreferrer" hidden>เปิดโพสต์ต้นฉบับ ↗</a><small role="status" id="photoStatus"></small></div>
<div class="storyfoot"><span id="cue"></span><div><button id="back" aria-label="โพสต์ก่อนหน้า">←</button><button id="forward" aria-label="โพสต์ถัดไป">→</button></div></div></section></div>
<button class="plain" id="overviewBack" hidden>← กลับไปดูภาพรวม</button><button class="cta" id="open">เห็นโพสต์นี้แล้ว ให้อะไรดี? <b>↗</b></button>
<section id="expanded" aria-label="ของขวัญที่เลือกให้" hidden>
<div class="gift"><span id="giftLabel" hidden>ของขวัญที่เลือกให้</span><span id="brand"></span><h1 id="product"></h1><strong id="price"></strong><p id="shortReason" hidden></p><details id="reasonDetail"><summary>ทำไมถึงเลือกชิ้นนี้</summary><p id="reason"></p><div id="citations" aria-label="โพสต์ที่ใช้เลือกของ"></div></details><button class="cta" id="equip">ใส่ช่องของขวัญ ＋</button></div>
<section id="notePanel" hidden><label for="note">ตอนยื่นให้ อยากบอกว่า…</label><textarea id="note" rows="2" maxlength="240"></textarea><button class="cta" id="save">ส่งของที่เลือกกับโน้ตเข้าแชต ↗</button></section>
<button class="plain" id="close">← กลับไปดูโพสต์</button></section>
<section id="sharing" hidden><button id="shareCard" type="button">แชร์การ์ดนี้ ↗</button><p id="shareStatus" role="status"></p><figure id="sharePreview" hidden><img id="saveImage" alt="การ์ดสรุปสำหรับบันทึก"><figcaption>กดค้างหรือคลิกขวาที่รูปเพื่อบันทึก</figcaption><a id="downloadCard" download="shopshop-gift-mix.png">ดาวน์โหลด PNG ↓</a></figure></section>
<section id="summary" hidden><h2 id="likesTitle">ความสนใจในโพสต์</h2><div id="likes"></div><h2 id="whereTitle">พิกัดที่เธอพูดถึง</h2><div id="places"></div></section>
<p class="status" id="status" role="status"></p></div></main>
<script>/* RECAP */</script><script>const fixture="DEMO_FIXTURE";/* STORY_APP */</script><script>/* TURNTABLE */</script></body></html>
