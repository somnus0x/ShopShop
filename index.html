<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>shopshop · ของที่เห็นแล้วนึกถึงเธอ</title><style>:root{color-scheme:light;font:16px/1.55 Thonburi,"Noto Sans Thai",system-ui,sans-serif;--ink:#102d25;--cream:#fbfaf2;--line:#bdc9bc;--jade:#075641;--acid:#ddff69;color:var(--ink)}*{box-sizing:border-box}body{margin:0;background:var(--cream)}main{max-width:690px;margin:auto;padding:clamp(12px,3vw,24px)}header,.by,.storyfoot,.storyfoot div,.cta{display:flex;align-items:center;justify-content:space-between;gap:10px}header{margin:0 2px 14px}.logo{font:850 1.55rem/1 system-ui;letter-spacing:-.075em}header span,.by,.storyfoot,.status{font-size:.8rem}button,textarea{font:inherit}button{color:inherit;cursor:pointer;touch-action:manipulation;min-height:44px}button:focus-visible,textarea:focus-visible{outline:3px solid #a62957;outline-offset:3px}.story{position:relative;border-radius:20px;padding:14px 18px 6px;background:var(--acid);color:#18352a;overflow:hidden}.story[data-tone="1"]{background:#b9dcff}.story[data-tone="2"]{background:#ffc5ac}.segments{display:flex;gap:4px}.segments i{height:4px;flex:1;border-radius:2px;background:#1e3b2d38}.segments .on{background:var(--ink)}.by{margin-top:10px;font-weight:650}.by span:last-child{font-variant-numeric:tabular-nums}.story button{background:none;border:0}#surface{position:relative;display:grid;width:100%;text-align:start;min-height:175px;align-content:center;padding:15px 64px 15px 2px}#quote{font-size:clamp(1.5rem,4.8vw,2.35rem);font-weight:780;line-height:1.42;letter-spacing:-.035em;text-wrap:balance;quotes:"“" "”"}.sticker{position:absolute;right:2px;top:18px;font-size:2.7rem;transform:rotate(12deg);pointer-events:none}.storyfoot{border-top:1px solid #15382732}.storyfoot button,.spin button{min-width:44px;font-size:1.25rem}.storyfoot div{gap:0}.cta{border:0;border-radius:12px;width:100%;padding:13px 17px;background:var(--ink);color:var(--cream);font-weight:650;margin-top:10px}.cta:hover{background:var(--jade)}.cta:disabled{background:#53615a;cursor:default}h1,h2,p{margin:0}.loadout{display:grid;grid-template-columns:minmax(130px,.64fr) minmax(0,1.36fr);gap:20px;margin-top:18px}.gift{align-self:center}.gift>span,#pin{font:700 .72rem/1.4 system-ui;letter-spacing:.08em}.gift h1{font-size:clamp(1.3rem,3.8vw,2rem);line-height:1.1;letter-spacing:-.04em;margin:7px 0}.gift strong{color:var(--jade)}.gift h2{font-size:.98rem;margin:14px 0 3px}.gift p{font-size:.94rem}#portrait{position:relative;min-height:210px;background:#83817a;border-radius:10px;overflow:hidden}.spin{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;align-items:center;white-space:nowrap;background:var(--cream);border-radius:22px;font-size:.7rem}.spin button{border:0;background:none}#scene{position:absolute;width:100%;height:100%;touch-action:pan-y;cursor:grab}#pin{position:absolute;top:10px;left:9px;background:var(--cream);padding:2px 5px;font-size:.57rem}.plain{background:none;border:0;text-decoration:underline;text-underline-offset:4px;margin-top:7px}#notePanel{margin-top:18px;padding:16px;background:#e6ede3;border-radius:12px}label{display:block;font-weight:650}textarea{width:100%;padding:8px;border:1px solid var(--line);border-radius:5px;background:var(--cream);resize:vertical;margin-top:6px}.status:not(:empty){margin-top:10px}.gift.solo{grid-column:1/-1}.story.pulse #quote{animation:reveal .18s ease-out}@keyframes reveal{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}[hidden]{display:none!important}@media(max-width:460px){#surface{min-height:168px;padding-right:38px}.sticker{font-size:1.95rem;right:-6px;top:4px}.loadout{grid-template-columns:90px 1fr;gap:12px}.spin span{display:none}.gift p{font-size:.85rem}.story{border-radius:15px}.gift .cta{padding:10px}.gift h1{overflow-wrap:anywhere}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.story[data-tone="summary"]{background:var(--ink);color:var(--acid)}
.story[data-tone="summary"] .segments i{background:#dfff683e}
.story[data-tone="summary"] .segments .on{background:var(--acid)}
.story[data-tone="summary"] .storyfoot{border-color:#dfff6844}
.story:not([data-tone="summary"]) #quote:before{content:'“'}
.story:not([data-tone="summary"]) #quote:after{content:'”'}
#summary{padding:14px 3px 4px}#summary h2{font-size:.86rem;margin-bottom:4px}
#likes,#places{display:flex;flex-wrap:wrap;gap:5px}
#likes button,#places button{background:#edf1e6;border:1px solid #c2cdbf;color:var(--ink);border-radius:12px;padding:6px 11px;font-size:.83rem}
#whereTitle{margin-top:12px}#open:disabled{cursor:default}

#citations{display:flex;gap:8px;flex-wrap:wrap}#citations button{background:none;border:0;color:var(--jade);padding:4px;text-decoration:underline;text-underline-offset:3px;font-size:.8rem}

/* The recap opens like a record sleeve. All profile copy stays live and selectable. */
.logo{display:inline-flex;align-items:center;gap:7px}
.brandmark{box-sizing:content-box;width:29px;height:29px;padding:3px;object-fit:contain;border-radius:9px;background:var(--ink)}

.story-copy{display:grid;min-width:0;gap:6px}
.story[data-tone="summary"]{border-radius:18px 18px 0 0;padding:10px 18px 0}
.story[data-tone="summary"] #surface{display:grid;grid-template-columns:minmax(0,1fr) minmax(96px,27%);align-items:center;gap:14px;padding:10px 0 12px;min-height:0}
.story[data-tone="summary"] .story-copy{grid-column:1;grid-row:1}
#mixLabel{font:750 .82rem/1.2 system-ui;color:#d1beff}
.story[data-tone="summary"] #quote{font-size:clamp(1.48rem,4.7vw,2.1rem);font-weight:800;color:#fffdee;line-height:1.28}
#recapArt{grid-column:2;grid-row:1;position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;isolation:isolate;transform:rotate(7deg)}
#recapArt:before{content:"";position:absolute;inset:10%;border:3px solid var(--ink);border-radius:50%;background:var(--jade)}
#recapArt[data-cover="brand"]:after{content:"S";z-index:1;font:900 2.7rem/1 system-ui;transform:rotate(-7deg)}
#juneArt{position:absolute;inset:12%;width:76%;height:76%;object-fit:cover;object-position:50% 15%;border-radius:50%;transform:rotate(-7deg)}
#mixLegend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.8rem;color:var(--cream);font-variant-numeric:tabular-nums}
#mixLegend span{display:inline-flex;align-items:center;gap:5px}#mixLegend span:before{content:"";width:8px;height:8px;background:var(--dot);border-radius:50%}
#recapDetail{font-size:.76rem;font-weight:650;color:#ffcfb4;overflow-wrap:anywhere}
.story[data-tone="summary"] .storyfoot{font-size:.75rem}
.featured{position:relative;background:#d8c8ff;padding:16px 18px 18px;border-radius:0 0 18px 18px}
.featured:before{content:"";position:absolute;left:0;right:0;top:-1px;height:6px;background:radial-gradient(circle at 6px 0,var(--ink) 3px,transparent 3.5px) 0 0/16px 6px repeat-x}
.featured .loadout{margin:0;gap:16px;grid-template-columns:minmax(100px,.52fr) minmax(0,1.48fr)}
.featured #portrait{border-radius:9px;min-height:190px}
#giftLabel{display:block;width:fit-content;border-bottom:2px solid;margin-bottom:8px;font:750 .86rem/1.6 Thonburi,system-ui}
.featured #brand{display:block;margin-bottom:4px}
.featured .gift h1{font-family:system-ui,sans-serif;font-weight:830;line-height:1.04;margin:5px 0 8px}
.featured .gift strong{font-size:.83rem;display:block}
.gift #shortReason{font-size:.96rem;font-weight:580;line-height:1.5;margin:8px 0 0}
#reasonDetail summary{cursor:pointer;padding:9px 0;font-size:.81rem;text-decoration:underline;text-underline-offset:3px}
#reasonDetail p{margin-bottom:2px}.featured #notePanel{background:#fffcf4}
#sharing{padding:9px 0 0}#shareCard{display:block;width:100%;background:transparent;border:1.5px solid var(--ink);border-radius:11px;font-weight:700}
#shareCard:hover{background:#edf0e4}#shareCard:disabled{opacity:.65}
#sharePreview{margin:10px auto;text-align:center}#saveImage{width:min(100%,360px);height:auto;border-radius:6px}#sharePreview figcaption,#shareStatus{font-size:.84rem}
#downloadCard{color:var(--jade);display:inline-block;padding:8px}.story[data-tone="summary"] .segments{display:none}
@media(max-width:460px){
 .featured{padding:14px 12px}.featured .loadout{grid-template-columns:minmax(74px,.46fr) minmax(0,1fr);gap:12px}
 .featured .gift h1{font-size:1.38rem}.featured #portrait{min-height:165px}
 .featured .spin button{min-width:34px}.featured .spin{max-width:100%}
 .story[data-tone="summary"]{padding:8px 12px 0}.story[data-tone="summary"] #surface{gap:8px}
}

#profileTop.with-model{display:grid;grid-template-columns:minmax(105px,28%) minmax(0,1fr);gap:8px;align-items:stretch}
#profileTop #portrait{min-height:195px;border-radius:15px}#pin{top:8px;left:8px;letter-spacing:0;font:700 .72rem/1.65 Thonburi,system-ui;color:var(--ink);border-radius:3px}
#profileTop .story{border-radius:15px}.with-model .spin span{display:none}
.featured{margin-top:12px;padding:18px 20px 20px;border-radius:16px;overflow:hidden}
.featured:before{background:radial-gradient(circle at 6px 0,var(--cream) 3px,transparent 3.5px) 0 0/16px 6px repeat-x}
.gift{min-width:0}.featured #giftLabel{display:block;margin-bottom:10px}
.featured .gift h1{font-size:clamp(1.6rem,5vw,2.4rem)}.gift #shortReason{max-width:52ch}
#summary{margin:12px 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:6px 14px}
#summary h2{margin:0;font-size:.9rem}#likesTitle{grid-column:1;grid-row:1}#whereTitle{grid-column:2;grid-row:1}
#likes{grid-column:1;grid-row:2;display:grid;gap:3px;align-content:start}
#likes button{display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 5px;border:0;background:var(--ink);color:var(--cream);padding:6px 9px;text-align:left;font-size:.82rem;border-radius:7px}
#likes small{color:#c6dbca;font-size:.67rem;white-space:nowrap}
.post-meter{grid-column:1/-1;display:grid;grid-template-columns:repeat(var(--count),1fr);gap:3px}
.post-meter i{height:6px;border-radius:2px;background:#405a50}
#places{grid-column:2;grid-row:2;display:grid;gap:5px;align-content:start}
#places button{position:relative;isolation:isolate;overflow:hidden;text-align:left;padding:33px 12px 10px;min-height:88px;background:#e6eddd;color:#163f31;border:1px solid #bccbb8;border-radius:10px;font-weight:750;overflow-wrap:anywhere}
#places button:before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-radial-gradient(ellipse at 87% 34%,transparent 0 10px,#82aa894a 11px 12px,transparent 13px 20px);mask-image:linear-gradient(100deg,transparent,#000 65%)}
#places button:after{content:"";position:absolute;right:15%;top:18px;width:11px;height:11px;background:var(--jade);border:3px solid #dfff69;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 0 0 1px var(--jade)}
#places small{display:block;font-size:.72rem;font-weight:550}
#summary:has(#whereTitle[hidden]){grid-template-columns:1fr}
#summary:has(#likesTitle[hidden]){display:block}
@media(max-width:500px){
 #profileTop.with-model{grid-template-columns:clamp(78px,23vw,106px) minmax(0,1fr);gap:5px}
 .with-model .story[data-tone="summary"] #surface{grid-template-columns:1fr 56px;align-items:end;gap:3px}
 .with-model .story-copy{display:contents}.with-model #mixLabel,.with-model #quote{grid-column:1/-1}
 .with-model #mixLegend{grid-column:1;grid-row:3;align-self:center;gap:1px 6px}.with-model #recapArt{grid-column:2;grid-row:3 / span 2;width:56px;align-self:center}
 .with-model #recapDetail{grid-column:1;grid-row:4}.with-model .by{font-size:.68rem}
 .with-model .storyfoot>span{font-size:.7rem}.with-model .storyfoot button{min-width:32px}
 .with-model .spin button{min-width:34px}.featured{padding:14px 15px}
 #summary{gap:5px 8px}#likes button{grid-template-columns:1fr}#likes small{grid-row:2}
}

#sourceMedia{position:relative;margin:9px 0 0;background:var(--ink);overflow:hidden;border-radius:9px}
#postPhoto{display:block;width:100%;height:auto;max-height:340px;object-fit:contain}
#photoCredit{position:absolute;left:6px;bottom:6px;background:var(--cream);color:var(--ink);padding:2px 7px;border-radius:4px;font-size:.67rem}
#mediaActions{display:flex;align-items:center;flex-wrap:wrap;gap:4px 12px;padding-bottom:5px}
#attachPhoto,#sourceLink{background:transparent;color:inherit;border:0;font-size:.77rem;text-decoration:underline;text-underline-offset:3px}
#photoStatus:not(:empty){width:100%}.story:has(#sourceMedia:not([hidden])) #surface{min-height:0}
</style></head>

<script>// Each supplied post contributes once. Race and gym belong to the same fitness topic.
const topics = {
  race: ['ฟิตเนส', '#dfff69'], gym: ['ฟิตเนส', '#dfff69'],
  travel: ['เดินทาง', '#c4afff'], dogs: ['น้องหมา', '#ffb899'],
  plaid: ['แฟชั่น', '#88dce4'], flowers: ['ดอกไม้', '#ffb2d6'], place: ['สถานที่', '#fff0ba']
};
const placeLabels = {favorite:'ชอบไป', visited:'เคยไป', planned:'อยากไป'};
function recapModel(data) {
  const counts = new Map();
  for (const story of data.stories) {
    const [label,color] = topics[story.cue];
    const topic = counts.get(label) || {label,color,count:0};
    topic.count++;
    counts.set(label,topic);
  }
  const overview = data.overview;
  const place = overview.places.find(p=>p.relation==='favorite') || overview.places[0];
  const pick = overview.pick;
  return {
    demo:data.demo, total:data.stories.length, headline:overview.headline,
    groups:[...counts.values()].sort((a,b)=>b.count-a.count),
    place:place ? placeLabels[place.relation]+' · '+place.name : '',
    gift:pick ? {name:pick.product, brand:pick.brand, price:pick.price, reason:pick.short_reason} : null
  };
}
function ringGradient(model) {
  let angle = 0;
  return 'conic-gradient(from -90deg,'+model.groups.map(g=>{
    const start = angle;
    angle += 360*g.count/model.total;
    return g.color+' '+start+'deg '+angle+'deg';
  }).join(',')+')';
}
// Work in logical poster coordinates. Both the browser and the preview generator use this painter.
function paintRecap(context, model, art) {
  const c=context, ink='#102d25', lime='#dfff69', paper='#f9f7eb', lilac='#d4c3ff';
  c.save();
  c.scale(c.canvas.width/720,c.canvas.height/900);
  function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h);}
  function font(size,weight){c.font=weight+' '+size+'px Thonburi, "Noto Sans Thai", Arial, sans-serif';}
  function label(str,x,y,size,weight,color,maxWidth){
    font(size,weight);c.fillStyle=color;c.fillText(str,x,y,maxWidth);
  }
  function lines(str,width) {
    const tokens=typeof Intl.Segmenter==='function'
      ? Array.from(new Intl.Segmenter('th',{granularity:'word'}).segment(str),s=>s.segment) : Array.from(str);
    const result=[];let line='';
    for (const token of tokens){
      if(line && c.measureText(line+token).width>width){result.push(line.trim());line=token.trimStart();}
      else line+=token;
    }
    if(line.trim())result.push(line.trim());
    return result;
  }
  function block(str,x,y,width,size,minSize,maxLines,weight,color,step){
    let rows;
    for(;;size--){font(size,weight);rows=lines(str,width);if(rows.length<=maxLines || size<=minSize)break;}
    c.fillStyle=color;
    for(const row of rows){c.fillText(row,x,y,width);y+=size*step;}
    return y;
  }
  rect(0,0,720,900,ink);
  label('shopshop',38,65,44,900,lime,300);
  c.textAlign='right';label(model.demo?'จูน  /  โปรไฟล์สมมติ':'จากโพสต์ที่แชร์',682,59,22,700,paper,290);c.textAlign='left';
  rect(38,85,644,2,'#618269');
  const clauses=model.headline.split(' ');
  if(clauses.length===2 && clauses.every(t=>t.length>5)){
    label(clauses[0],38,147,50,800,paper,640);
    label(clauses[1],38,207,50,800,paper,640);
  }else block(model.headline,38,154,646,50,36,2,800,paper,1.21);
  label('Vibe mix',40,253,31,800,lime,265);
  label(model.total+' โพสต์ที่แชร์',40,286,20,500,paper,275);
  model.groups.forEach((g,i)=>{
    const sparse=model.groups.length<=3;
    const y=(sparse?343:325)+i*(sparse?54:31);
    rect(41,y-13,14,14,g.color);
    label(g.label,67,y,sparse?29:20,700,paper,145);
    label(String(g.count),237,y,sparse?37:21,700,g.color,62);
  });
  const x=510,y=352,r=132;
  let angle=-Math.PI/2;
  for(const g of model.groups){
    const span=2*Math.PI*g.count/model.total;
    c.beginPath();c.arc(x,y,r,angle+.012,angle+span-.012);c.lineWidth=30;c.strokeStyle=g.color;c.stroke();angle+=span;
  }
  c.save();c.beginPath();c.arc(x,y,109,0,2*Math.PI);c.clip();
  if(art){
    const w=art.naturalWidth||art.width,h=art.naturalHeight||art.height;
    const side=Math.min(w,h)*(model.demo ? 0.81 : 1);
    c.drawImage(art,(w-side)/2,model.demo?0:(h-side)/2,side,side,x-109,y-109,218,218);
  }else{rect(x-110,y-110,220,220,'#235944');label('S',x-32,y+32,91,800,lime,80);}
  c.restore();
  if(model.place)label(model.place,40,514,21,700,paper,640);
  rect(0,540,720,288,lilac);
  // The perforated edge makes the recommendation read like a detachable gift ticket.
  for(let i=0;i<720;i+=24){c.fillStyle=ink;c.beginPath();c.arc(i+12,540,5,0,Math.PI);c.fill();}
  if(model.gift){
    const gift=model.gift;
    label('ของขวัญที่เลือกให้',38,588,23,800,ink,310);
    c.textAlign='right';label('฿'+gift.price.toLocaleString('th-TH')+' · ราคาแคตตาล็อก',682,588,20,700,ink,290);c.textAlign='left';
    label(gift.brand,38,637,24,700,ink,640);
    const end=block(gift.name.replace(' · ',' / '),36,696,700,49,32,2,800,ink,1.08);
    block(gift.reason,38,Math.max(748,end+5),640,23,19,2,400,ink,1.36);
  }else{
    label('ของขวัญที่เลือกให้',38,616,26,700,ink,640);
    block('ยังไม่มีของที่เข้ากับโพสต์และงบนี้',38,705,640,45,32,2,800,ink,1.2);
  }
  label(model.gift?'ชิ้นนี้ใช่เธอกี่เต็มสิบ?':'เห็นโพสต์นี้แล้ว นึกถึงของขวัญอะไร?',38,874,25,700,lime,600);
  c.restore();
}

new ResizeObserver(redraw).observe(canvas);
canvas.onpointerdown=e=>{if(e.button!==0)return;start=e.clientX;downYaw=yaw;canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{
  const rect=canvas.getBoundingClientRect();pan=Math.max(-1,Math.min(1,2*(e.clientX-rect.left)/rect.width-1));
  if(start!==null){yaw=downYaw+(e.clientX-start)/Math.max(20,rect.width/12);$('spinlabel').textContent=(thaiPortrait?'ปล่อยเพื่อหยุด':'Release to settle');}
  redraw();
};
function settle(){start=null;yaw=Math.round(yaw);pan=0;$('spinlabel').textContent=(thaiPortrait?'ลากเพื่อหมุน':'Drag to rotate');redraw();}
canvas.onpointerup=settle;canvas.onpointercancel=settle;canvas.onlostpointercapture=settle;
canvas.onpointerleave=()=>{if(start===null){pan=0;redraw();}};
function step(size){yaw=Math.round(yaw)+size;redraw();}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);
$('portrait').addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();step(e.key==='ArrowLeft'?-1:1);}});
</script></body></html>
